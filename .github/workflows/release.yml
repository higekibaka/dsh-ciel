name: release

# Tag-driven npm publish through npm Trusted Publishing (OIDC): no tokens,
# no OTP — the workflow's OIDC identity (repo + this filename) is what the
# package's Trusted Publisher entry authorizes. Cut a release by bumping
# plugin/package.json (+ CHANGELOG.md), committing, and pushing tag vX.Y.Z.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish without moving it
        required: true
        type: string

permissions:
  id-token: write # OIDC for npm Trusted Publishing
  contents: write # publish the matching GitHub Release after npm succeeds

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected stable vX.Y.Z tag'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@11
      - name: Install root development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies (dev only; never shipped)
        run: pnpm --dir plugin install --frozen-lockfile
      - name: Check publication privacy
        run: |
          node scripts/check-publication.mjs
          node scripts/check-publication.mjs --package
      - name: Verify bundled client matches plugin/src
        run: node scripts/build-client.mjs --check
      - name: Syntax check
        run: |
          node --check plugin/index.js
          node --check plugin/client.js
          node --check plugin/ptc-runtime.js
      - name: Unit tests
        run: node --test
        working-directory: plugin
      - name: Tag must match package version
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG="$(node -p "require('./plugin/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match plugin/package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: plugin
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs > "$RUNNER_TEMP/ciel-release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Ciel ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/ciel-release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Ciel ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/ciel-release-notes.md"
          fi
