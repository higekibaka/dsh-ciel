name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root development dependencies
        run: pnpm install --frozen-lockfile
      - name: Install plugin dependencies
        run: pnpm --dir plugin install --frozen-lockfile
      - name: Check publication privacy
        run: |
          node scripts/check-publication.mjs
          node scripts/check-publication.mjs --package
      - name: Verify bundled client matches plugin/src
        run: node scripts/build-client.mjs --check
      - name: Syntax check
        run: |
          node --check plugin/index.js
          node --check plugin/client.js
          node --check plugin/ptc-runtime.js
      - name: Unit tests
        run: node --test
        working-directory: plugin
      - name: Pack dry-run
        run: npm pack --dry-run --ignore-scripts
        working-directory: plugin

  # Offline integration against pinned DSH releases.
  # No --live and no paid model calls; linked peers share the host registry.
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dsh-v0.1.6-alpha.2
            commit: ddefc45fbc7f8e46dd73185e68295696d1297887
          - target: dsh-v0.1.7-alpha.1
            commit: c36a83ff6bb95e3f82cf79f9be7c724270a8aa61
          - target: dsh-v0.2.0-rc.2
            commit: 639ed015397290b3745d163aafe02ffee4aa3f84
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root and plugin dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir plugin install --frozen-lockfile
      - name: Checkout pinned DSH target
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ matrix.commit }}
          path: .dsh-target
      - name: Install DSH target dependencies
        working-directory: .dsh-target
        run: pnpm install --ignore-scripts --frozen-lockfile=false
      - name: Build DSH target libraries
        working-directory: .dsh-target
        run: pnpm build:lib
      - name: Link shared DSH peers
        run: DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target node scripts/link-harness-peers.mjs
      - name: Offline DSH execution-chain replay
        run: DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target CIEL_VERIFY_NATIVE_PEERS=1 node scripts/verify-runtime.mjs
      - name: Offline DSH protocol verification
        run: DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target node scripts/verify-protocol.mjs
      - name: Offline native sidebar verification
        working-directory: .dsh-target
        run: |
          DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target \
          TSX_TSCONFIG_PATH=$GITHUB_WORKSPACE/.dsh-target/tsconfig.base.client.json \
          node --import tsx/esm $GITHUB_WORKSPACE/scripts/verify-sidebar-native.mjs

      - name: Native settings page
        working-directory: .dsh-target
        run: |
          DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target \
          TSX_TSCONFIG_PATH=$GITHUB_WORKSPACE/.dsh-target/tsconfig.base.client.json \
          node --import tsx/esm $GITHUB_WORKSPACE/scripts/verify-native-settings.mjs
      - name: Profile-backed settings and pre-upgrade migration
        if: matrix.target != 'dsh-v0.1.6-alpha.2'
        run: |
          DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target node scripts/verify-profile-settings.mjs
          DSH_CHECKOUT=$GITHUB_WORKSPACE/.dsh-target node --test scripts/test/settings-migration.test.mjs
