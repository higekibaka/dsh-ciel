# Dev-instance overlay: boot the advisor-test profile on a separate port so it
# never collides with the main GUI on 3080. A patch replaces a row's ENTIRE
# config, so both required keys are restated.
#
# Usage: pnpm dsh --profile advisor-test --patch <repo>/scripts/dev-instance.patch.yml
- id: webserver
  config:
    host: 127.0.0.1
    port: 3180
