# dsh-ciel bundle layer: applied automatically when the package is
# installed (package.json declares dsh.bundle.patch). Later layers (the
# profile's own cordis.patch.yml, --patch overlays) override this row by id.
#
# The row mounts at the HOST layer on purpose:
#   - Settings → 夏尔 Ciel edits this `advisor` Profile entry on modern DSH;
#     older hosts use the `ciel` settings namespace via the legacy adapter.
#     The entry id stays stable for configuration continuity;
#   - the `ask_advisor` tool and the guidance prompt section become available
#     to every agent in every preset, matching how dsh-vision-router wires
#     its global tools.
- insert:
    - id: advisor
      name: dsh-ciel
